<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street Racer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at top, #243044, #0b1018 70%);
    color: #fff; font-family: Arial, sans-serif;
  }
  .wrap { width: min(94vw, 430px); text-align: center; }
  h1 { margin: 8px 0 4px; letter-spacing: 3px; }
  .sub { margin: 0 0 14px; color: #aab5c6; font-size: 13px; }
  .hud { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; }
  .gamebox { position: relative; overflow: hidden; border: 3px solid #697789; border-radius: 14px; box-shadow: 0 18px 55px #0009; }
  canvas { display: block; width: 100%; background: #303943; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
    background: #070b12c9; text-align: center;
  }
  .overlay h2 { font-size: 30px; margin: 0 0 10px; }
  .overlay p { color: #d1d8e2; line-height: 1.5; }
  button {
    border: 0; border-radius: 10px; padding: 13px 24px; font-size: 16px;
    font-weight: bold; color: #07111b; background: #51e0b4; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .controls { display: flex; justify-content: center; gap: 24px; margin-top: 12px; }
  .controls button { width: 92px; font-size: 24px; padding: 10px; touch-action: none; }
  .hint { color: #9eabba; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>STREET RACER</h1>
  <p class="sub">Обгони трафик. Не врезайся.</p>
  <div class="hud"><span>Очки: <span id="score">0</span></span><span>Рекорд: <span id="best">0</span></span></div>
  <div class="gamebox">
    <canvas id="game" width="360" height="600"></canvas>
    <div class="overlay" id="overlay">
      <h2>Готов к гонке?</h2>
      <p>Управляй машиной, уворачивайся от других автомобилей и набирай очки.</p>
      <p>Клавиши: ← → или A / D</p>
      <button id="start">НАЧАТЬ ГОНКУ</button>
    </div>
  </div>
  <div class="controls">
    <button id="left" aria-label="Влево">◀</button>
    <button id="right" aria-label="Вправо">▶</button>
  </div>
  <div class="hint">На телефоне используй кнопки. На компьютере — стрелки или A / D.</div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start');

let running = false, score = 0, best = Number(localStorage.getItem('streetRacerBest') || 0);
let player, traffic, roadOffset, spawnTimer, lastTime, speed;
let keys = { left: false, right: false };
bestEl.textContent = best;

function reset() {
  player = { x: 158, y: 490, w: 44, h: 78 };
  traffic = []; roadOffset = 0; spawnTimer = 0; score = 0; speed = 230;
  scoreEl.textContent = '0';
}
function car(x, y, w, h, color, isPlayer=false) {
  ctx.fillStyle = '#0005';
  ctx.fillRect(x+3, y+5, w, h);
  ctx.fillStyle = '#14191f';
  ctx.fillRect(x-4, y+12, 7, 17); ctx.fillRect(x+w-3, y+12, 7, 17);
  ctx.fillRect(x-4, y+h-27, 7, 17); ctx.fillRect(x+w-3, y+h-27, 7, 17);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.fill();
  ctx.fillStyle = isPlayer ? '#b8f4ff' : '#dce9f6';
  ctx.beginPath(); ctx.roundRect(x+7, y+13, w-14, 20, 4); ctx.fill();
  ctx.fillStyle = '#27384a';
  ctx.beginPath(); ctx.roundRect(x+7, y+39, w-14, 18, 4); ctx.fill();
  ctx.fillStyle = '#fff2a6';
  ctx.fillRect(x+5, y+3, 9, 4); ctx.fillRect(x+w-14, y+3, 9, 4);
  ctx.fillStyle = '#ff4b56';
  ctx.fillRect(x+5, y+h-5, 9, 4); ctx.fillRect(x+w-14, y+h-5, 9, 4);
}
function drawRoad(dt) {
  ctx.fillStyle = '#246844'; ctx.fillRect(0, 0, 360, 600);
  ctx.fillStyle = '#353c45'; ctx.fillRect(28, 0, 304, 600);
  ctx.fillStyle = '#f5f0d8'; ctx.fillRect(33, 0, 4, 600); ctx.fillRect(323, 0, 4, 600);
  roadOffset = (roadOffset + speed * dt) % 72;
  ctx.fillStyle = '#e8e9e8';
  for (let y = -72 + roadOffset; y < 620; y += 72) {
    ctx.fillRect(132, y, 5, 38); ctx.fillRect(223, y, 5, 38);
  }
  // Roadside dashes
  ctx.fillStyle = '#d4b66a';
  for (let y = -40 + (roadOffset * 1.2) % 80; y < 620; y += 80) {
    ctx.fillRect(12, y, 7, 24); ctx.fillRect(341, y, 7, 24);
  }
}
function draw() {
  drawRoad(0);
  traffic.forEach(t => car(t.x, t.y, t.w, t.h, t.color));
  car(player.x, player.y, player.w, player.h, '#18b8ff', true);
}
function collide(a, b) {
  return a.x + 7 < b.x + b.w - 7 && a.x + a.w - 7 > b.x + 7 &&
         a.y + 8 < b.y + b.h - 8 && a.y + a.h - 8 > b.y + 8;
}
function endGame() {
  running = false;
  if (score > best) { best = score; localStorage.setItem('streetRacerBest', best); bestEl.textContent = best; }
  overlay.innerHTML = `<h2>Авария!</h2><p>Твои очки: <strong>${score}</strong><br>Рекорд: <strong>${best}</strong></p><button id="restart">ЕЩЁ РАЗ</button>`;
  overlay.style.display = 'flex';
  document.getElementById('restart').addEventListener('click', startGame);
}
function frame(now) {
  if (!running) return;
  const dt = Math.min((now - lastTime) / 1000 || 0, 0.035);
  lastTime = now;
  speed = Math.min(230 + score * 1.5, 440);
  if (keys.left) player.x -= 250 * dt;
  if (keys.right) player.x += 250 * dt;
  player.x = Math.max(42, Math.min(274, player.x));
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    const lanes = [58, 150, 242];
    const lane = lanes[Math.floor(Math.random() * lanes.length)];
    traffic.push({ x: lane, y: -90, w: 44, h: 76, color: ['#ffb52e','#ef476f','#b78bfa','#f4f4f4'][Math.floor(Math.random()*4)] });
    spawnTimer = Math.max(0.48, 1.0 - score * 0.004) + Math.random() * 0.3;
  }
  for (const t of traffic) {
    t.y += speed * dt;
    if (collide(player, t)) { draw(); endGame(); return; }
  }
  const before = traffic.length;
  traffic = traffic.filter(t => t.y < 630);
  score += before - traffic.length;
  scoreEl.textContent = score;
  drawRoad(dt);
  traffic.forEach(t => car(t.x, t.y, t.w, t.h, t.color));
  car(player.x, player.y, player.w, player.h, '#18b8ff', true);
  requestAnimationFrame(frame);
}
function startGame() {
  reset(); overlay.style.display = 'none'; running = true;
  lastTime = performance.now(); requestAnimationFrame(frame);
}
startBtn.addEventListener('click', startGame);
document.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key)) e.preventDefault();
  if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = true;
  if (!running && e.key === 'Enter') startGame();
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = false;
});
function bindHold(id, key) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); keys[key] = true; };
  const off = e => { e.preventDefault(); keys[key] = false; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('pointercancel', off);
}
bindHold('left','left'); bindHold('right','right');
reset(); draw();
</script>
</body>
</html>
